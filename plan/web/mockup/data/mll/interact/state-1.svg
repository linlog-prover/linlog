<svg xmlns="http://www.w3.org/2000/svg" role="img" width="157.44" height="71.84" viewBox="0 0 9840 4490" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>⊢ A⊥ ⅋ B⊥, B ⊗ A</title>
<desc>1. ⊢ ~A, ~B, B ⊗ A, open.
2. ⊢ ~A ⅋ ~B, B ⊗ A, by ⅋ from 1.</desc>
<g fill="none" stroke="black" stroke-width="40">
<path d="M300 2890H8751"/>
</g>
<g id="i1">
<text x="300" y="3980" textLength="1801" lengthAdjust="spacing">⊢ 𝐴</text>
<text x="2101" y="3580" textLength="611" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="3045" y="3980" textLength="1725" lengthAdjust="spacing">⅋ 𝐵</text>
<text x="4770" y="3580" textLength="612" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="5382" y="3980" textLength="3369" lengthAdjust="spacing">, 𝐵 ⊗ 𝐴</text>
</g>
<text x="8951" y="3090" textLength="589" lengthAdjust="spacing" font-size="800">⅋</text>
<g id="i0">
<text x="696" y="2480" textLength="1801" lengthAdjust="spacing">⊢ 𝐴</text>
<text x="2497" y="2080" textLength="611" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="3108" y="2480" textLength="1265" lengthAdjust="spacing">, 𝐵</text>
<text x="4373" y="2080" textLength="612" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="4985" y="2480" textLength="3369" lengthAdjust="spacing">, 𝐵 ⊗ 𝐴</text>
</g>
<text x="4141" y="1190" textLength="768" lengthAdjust="spacing">⋮</text>
</svg>
