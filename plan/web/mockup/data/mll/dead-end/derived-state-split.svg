<svg xmlns="http://www.w3.org/2000/svg" role="img" width="163.008" height="95.84" viewBox="0 0 10188 5990" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>⊢ A⊥ ⅋ B⊥, B ⊗ A</title>
<desc>1. ⊢ ~A, B, open.
2. ⊢ ~B, A, open.
3. ⊢ ~A, ~B, B ⊗ A, by ⊗ from 1 and 2.
4. ⊢ ~A ⅋ ~B, B ⊗ A, by ⅋ from 3.</desc>
