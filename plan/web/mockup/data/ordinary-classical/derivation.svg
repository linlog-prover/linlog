<text x="966" y="3402" textLength="3780" lengthAdjust="spacing" id="i1">𝑎 ⊢ 𝑏, 𝑎</text>
<text x="4946" y="2512" textLength="1276" lengthAdjust="spacing" font-size="800">WR</text>
<text x="1565" y="1902" textLength="2582" lengthAdjust="spacing" id="i0">𝑎 ⊢ 𝑎</text>
<text x="4347" y="1012" textLength="908" lengthAdjust="spacing" font-size="800">ax</text>
<text x="8400" y="4902" textLength="2582" lengthAdjust="spacing" id="i3">𝑎 ⊢ 𝑎</text>
