<text x="1758" y="6402" textLength="7767" lengthAdjust="spacing" id="i4">(𝑎 → 𝑏) → 𝑎 ⊢ 𝑎</text>
<text x="11182" y="5512" textLength="1247" lengthAdjust="spacing" font-size="800">→L</text>
<text x="300" y="4902" textLength="5113" lengthAdjust="spacing" id="i2">⊢ 𝑎 → 𝑏, 𝑎</text>
