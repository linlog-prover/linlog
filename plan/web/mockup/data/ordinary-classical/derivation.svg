<svg xmlns="http://www.w3.org/2000/svg" role="img" width="203.664" height="134.592" viewBox="0 0 12729 8412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>⊢ ((a → b) → a) → a</title>
<desc>1. a ⊢ a, by ax.
2. a ⊢ b, a, by WR from 1.
3. ⊢ a → b, a, by →R from 2.
4. a ⊢ a, by ax.
5. (a → b) → a ⊢ a, by →L from 3 and 4.
6. ⊢ ((a → b) → a) → a, by →R from 5.</desc>
