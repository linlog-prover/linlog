<title>⊢ ((A⊥ ⅋ B⊥) ⅋ C⊥) ⅋ D⊥, ((D ⊗ C) ⊗ B) ⊗ A</title>
<desc>1. ⊢ ~D, D, by ax.
2. ⊢ ~C, C, by ax.
3. ⊢ ~C, ~D, D ⊗ C, by ⊗ from 1 and 2.
4. ⊢ ~B, B, by ax.
5. ⊢ ~B, ~C, ~D, (D ⊗ C) ⊗ B, by ⊗ from 3 and 4.
6. ⊢ ~A, A, by ax.
7. ⊢ ~A, ~B, ~C, ~D, ((D ⊗ C) ⊗ B) ⊗ A, by ⊗ from 5 and 6.
8. ⊢ ~A ⅋ ~B, ~C, ~D, ((D ⊗ C) ⊗ B) ⊗ A, by ⅋ from 7.
9. ⊢ (~A ⅋ ~B) ⅋ ~C, ~D, ((D ⊗ C) ⊗ B) ⊗ A, by ⅋ from 8.
10. ⊢ ((~A ⅋ ~B) ⅋ ~C) ⅋ ~D, ((D ⊗ C) ⊗ B) ⊗ A, by ⅋ from 9.</desc>
