<title>⊢ ?A⊥, A ⊗ !A</title>
<desc>1. ⊢ ~A, A, by ax.
2. ⊢ ?~A, A, by ?d from 1.
3. ⊢ ~A, A, open.
4. ⊢ ?~A, A, by ?d from 3.
5. ⊢ ?~A, !A, by ! from 4.
6. ⊢ ?~A, ?~A, A ⊗ !A, by ⊗ from 2 and 5.
7. ⊢ ?~A, A ⊗ !A, by ?c from 6.</desc>
