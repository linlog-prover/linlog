[workspace]
resolver = "3"
members = ["bench", "cli", "core"]

[workspace.metadata.crane]
name = "linlog-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Every item gets a doc comment (CLAUDE.md, Conventions): rustc checks the
# public ones, clippy the private ones.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unnameable_types = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unit_bindings = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
# Fire today: each goes to "warn" once its sites are fixed.
elided_lifetimes_in_paths = "allow"
single_use_lifetimes = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
# Picked from the nursery and restriction groups, which are not taken
# whole: the nursery's lints are unfinished, the restriction group's
# contradict each other by design.
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
string_lit_chars_any = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
# Pedantic lints set aside: they flag what this code means to do, and a
# reviewer judges the cases that matter.
must_use_candidate = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
enum_glob_use = "allow"
single_match_else = "allow"
match_bool = "allow"
if_not_else = "allow"
items_after_statements = "allow"
naive_bytecount = "allow"
# Picked, and firing today: each goes to "warn" once its sites are fixed.
allow_attributes = "allow"
allow_attributes_without_reason = "allow"
branches_sharing_code = "allow"
debug_assert_with_mut_call = "allow"
derive_partial_eq_without_eq = "allow"
needless_pass_by_ref_mut = "allow"
or_fun_call = "allow"
redundant_clone = "allow"
too_long_first_doc_paragraph = "allow"
# Pedantic, and firing today: each line goes once its sites are fixed.
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
checked_conversions = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
elidable_lifetime_names = "allow"
explicit_iter_loop = "allow"
format_collect = "allow"
format_push_string = "allow"
inconsistent_struct_constructor = "allow"
inline_always = "allow"
manual_midpoint = "allow"
manual_string_new = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
maybe_infinite_iter = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
nonminimal_bool = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
semicolon_if_nothing_returned = "allow"
struct_excessive_bools = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_semicolon = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"

# The profile cargo-mutants builds with (.cargo/mutants.toml): the whole
# suite in about half a minute where the dev profile takes two, and the
# assertions and overflow checks of a development build kept.
[profile.mutants]
inherits = "dev"
opt-level = 1
debug = false
