[workspace]
resolver = "3"
members = ["bench", "cli", "core"]

[workspace.metadata.crane]
name = "linlog-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Every item gets a doc comment (CLAUDE.md, Conventions): rustc checks the
# public ones, clippy the private ones.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# The profile cargo-mutants builds with (.cargo/mutants.toml): the whole
# suite in about half a minute where the dev profile takes two, and the
# assertions and overflow checks of a development build kept.
[profile.mutants]
inherits = "dev"
opt-level = 1
debug = false
