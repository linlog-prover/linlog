[package]
name = "linlog-cli"
description = "The linlog command: decide, check, prove step by step and export sequents of linear logic, and ordinary logic through its translations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The binary embeds the Euler Math font (`fonts/`), under the OFL.
license = "EUPL-1.2 AND OFL-1.1"
repository.workspace = true
readme = "../README.md"
keywords = [
  "linear-logic",
  "theorem-prover",
  "proof-search",
  "sequent-calculus",
  "cli",
]
categories = ["command-line-utilities", "science", "mathematics"]
# README's examples are run against the repository's README, which this
# package carries only as its readme.
exclude = ["tests/readme.rs"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# The command is `linlog`; the package keeps its name next to the library's.
# The code is the library `linlog_cli`, so that rustdoc documents it under a
# name of its own: the binary, one call into it, is named like the core
# crate and would otherwise be written over it.
[lib]
name = "linlog_cli"
path = "src/lib.rs"

[[bin]]
name = "linlog"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "unicode"] }
ctrlc = "3.5.2"
linlog = { workspace = true, features = [
  "interactive",
  "latex",
  "parallel",
  "parse",
  "pdf",
  "png",
  "rocq",
  "serialize",
  "svg",
  "typst",
] }
serde = { version = "1.0.228", features = ["derive"] }
# raw_value: a JSON Lines record hands its sequent to the sequent reader
# as written, so that the reader refuses what it refuses in a file.
serde_json = { version = "1.0.149", features = ["raw_value"] }
terminal_size = "0.4.4"

[lints]
workspace = true
