[package]
name = "linlog-bench"
description = "The benchmark harness of linlog: problem families, the LLTP library, coverability problems, timings as CSV, and the ratchet of instruction counts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A command, not an API: rustdoc documents the two library crates only.
[[bin]]
name = "linlog-bench"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
linlog = { workspace = true, features = [
  "latex",
  "parallel",
  "parse",
  "serialize",
  "svg",
  "typst",
] }
serde_json = "1.0.149"

[lints]
workspace = true
