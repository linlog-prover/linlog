# linlog © Fabian Lukas Grubmüller 2026
# Licensed under the EUPL

[package]
name = "linlog"
description = "A linear logic suite: decides, checks, proves step by step and exports sequents of classical and intuitionistic linear logic, and ordinary propositional logic through its embeddings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["linear-logic", "theorem-prover", "proof-search", "sequent-calculus", "proof-nets"]
categories = ["science", "mathematics"]
# The export test reads the command's font from `cli/`, outside this
# package; the repository runs it.
exclude = ["tests/export.rs"]

# Every feature, so that `parallel`, `png` and `pdf`, which are off by
# default, are documented too; nothing in the API depends on the target.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
foldhash = "0.1.5"
krilla = { version = "0.8.2", optional = true }
krilla-svg = { version = "0.8.1", optional = true }
png = { version = "0.18.1", optional = true }
rayon = { version = "1.12.0", optional = true }
resvg = { version = "0.47", default-features = false, features = [
  "text",
], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.17"
unicode-ident = "1.0.26"
unicode-normalization = { version = "0.1.25", default-features = false }

[features]
default = ["interactive", "latex", "parse", "rocq", "serialize", "svg", "typst"]
interactive = []
latex = []
parse = []
rocq = []
serialize = ["dep:serde"]
svg = []
typst = []
parallel = ["dep:rayon"]
pdf = ["svg", "dep:resvg", "dep:krilla", "dep:krilla-svg"]
png = ["svg", "dep:resvg", "dep:png"]

[lints]
workspace = true

[dev-dependencies]
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
serde_json = "1.0.149"
