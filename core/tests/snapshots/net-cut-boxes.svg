<title>⊢ ?a⊥, ?b⊥, !(a ⊗ b) ⊗ a</title>
<desc>⊢ ?~a, ?~b, !(a ⊗ b) ⊗ a
?~a[0]: ~a[3] in !a[15], ~a[4] in !a[11]
?~b[1]: ~b[5] in !(a ⊗ b)[6]
?~a[13]: ~a[14] in !(a ⊗ b)[6]
?~a[17]: ~a[18]
cut !a[11] — ?~a[13]
cut !a[15] — ?~a[17]
~a[3] — a[16]
~a[4] — a[12]
~b[5] — b[9]
a[8] — ~a[14]
a[10] — ~a[18]
proof net</desc>
