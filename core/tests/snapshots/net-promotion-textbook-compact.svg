<title>⊢ ?a⊥, ?b⊥, ?(c⊥ ⅋ d⊥), !((a ⊗ a) ⊗ (d ⊗ c))</title>
<desc>⊢ ?~a, ?~b, ?(~c ⅋ ~d), !((a ⊗ a) ⊗ (d ⊗ c))
?~a[0]: ~a[4] in !((a ⊗ a) ⊗ (d ⊗ c))[3], ~a[5] in !((a ⊗ a) ⊗ (d ⊗ c))[3]
?~b[1]: no copy, hangs on a[11]
?(~c ⅋ ~d)[2]: ~c ⅋ ~d[6] in !((a ⊗ a) ⊗ (d ⊗ c))[3]
~a[4] — a[11]
~a[5] — a[12]
~c[7] — c[15]
~d[8] — d[14]
proof net</desc>
