<svg xmlns="http://www.w3.org/2000/svg" role="img" width="282.704" height="134.592" viewBox="0 0 17669 8412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>∃x. (∀y. p(x, y)) ⊢ ∀y. (∃x. p(x, y))</title>
<desc>1. p(a, b) ⊢ p(a, b), by ax.
2. p(a, b) ⊢ ∃x. p(x, b), by ∃R from 1.
3. ∀y. p(a, y) ⊢ ∃x. p(x, b), by ∀L from 2.
4. ∀y. p(a, y) ⊢ ∀y. (∃x. p(x, y)), by ∀R from 3.
5. ∃x. (∀y. p(x, y)) ⊢ ∀y. (∃x. p(x, y)), by ∃L from 4.</desc>
<g fill="none" stroke="black" stroke-width="40">
<path d="M300 6812H16202"/>
<path d="M1480 5312H15023"/>
<path d="M2737 3812H13766"/>
<path d="M3666 2312H12837"/>
<path d="M4517 812H11985"/>
</g>
<text x="300" y="7902" textLength="15902" lengthAdjust="spacing" id="i4">∃𝑥. (∀𝑦. 𝑝(𝑥, 𝑦)) ⊢ ∀𝑦. (∃𝑥. 𝑝(𝑥, 𝑦))</text>
<text x="16402" y="7012" textLength="967" lengthAdjust="spacing" font-size="800">∃L</text>
<text x="1480" y="6402" textLength="13543" lengthAdjust="spacing" id="i3">∀𝑦. 𝑝(𝑎, 𝑦) ⊢ ∀𝑦. (∃𝑥. 𝑝(𝑥, 𝑦))</text>
<text x="15223" y="5512" textLength="1007" lengthAdjust="spacing" font-size="800">∀R</text>
<text x="2737" y="4902" textLength="11029" lengthAdjust="spacing" id="i2">∀𝑦. 𝑝(𝑎, 𝑦) ⊢ ∃𝑥. 𝑝(𝑥, 𝑏)</text>
<text x="13966" y="4012" textLength="967" lengthAdjust="spacing" font-size="800">∀L</text>
<text x="3666" y="3402" textLength="9171" lengthAdjust="spacing" id="i1">𝑝(𝑎, 𝑏) ⊢ ∃𝑥. 𝑝(𝑥, 𝑏)</text>
<text x="13037" y="2512" textLength="1007" lengthAdjust="spacing" font-size="800">∃R</text>
<text x="4517" y="1902" textLength="7468" lengthAdjust="spacing" id="i0">𝑝(𝑎, 𝑏) ⊢ 𝑝(𝑎, 𝑏)</text>
<text x="12185" y="1012" textLength="908" lengthAdjust="spacing" font-size="800">ax</text>
</svg>
