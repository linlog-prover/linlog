<text x="8272" y="7502" textLength="611" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="8883" y="7902" textLength="8207" lengthAdjust="spacing">), ∀𝑦. (∃𝑥. 𝑝(𝑥, 𝑦))</text>
</g>
<text x="17290" y="7012" textLength="520" lengthAdjust="spacing" font-size="800">∀</text>
<g id="i3">
<text x="1480" y="6402" textLength="13820" lengthAdjust="spacing">⊢ ∀𝑦. (∃𝑥. 𝑝(𝑥, 𝑦)), ∃𝑦. 𝑝(𝑎, 𝑦)</text>
<text x="15300" y="6002" textLength="611" lengthAdjust="spacing" font-size="700">⊥</text>
</g>
<text x="16111" y="5512" textLength="520" lengthAdjust="spacing" font-size="800">∀</text>
<g id="i2">
<text x="2737" y="4902" textLength="5941" lengthAdjust="spacing">⊢ ∃𝑦. 𝑝(𝑎, 𝑦)</text>
<text x="8678" y="4502" textLength="611" lengthAdjust="spacing" font-size="700">⊥</text>
<text x="9289" y="4902" textLength="5365" lengthAdjust="spacing">, ∃𝑥. 𝑝(𝑥, 𝑏)</text>
</g>
<text x="14854" y="4012" textLength="520" lengthAdjust="spacing" font-size="800">∃</text>
<g id="i1">
