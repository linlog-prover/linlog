<svg xmlns="http://www.w3.org/2000/svg" role="img" width="387.84" height="110.592" viewBox="0 0 24240 6912" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>⊢ A⊥, A ⊗ B⊥, B</title>
<desc>1. ⊢ A, ~A, by ax.
2. ⊢ ~B, B, by ax.
3. ⊢ A ⊗ ~B, ~A, B, by ⊗ from 1 and 2.
4. ⊢ A ⊗ ~B, ~A ⅋ B, by ⅋ from 3.
5. ⊢ ~A, A, by ax.
6. ⊢ B, ~B, by ax.
7. ⊢ ~A, B, A ⊗ ~B, by ⊗ from 5 and 6.
8. ⊢ ~A, A ⊗ ~B, B, by cut from 4 and 7.</desc>
