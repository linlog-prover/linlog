<title>⊢ ?a⊥, ?(a ⊗ b⊥), !(b ⊗ a)</title>
<desc>⊢ ?~a, ?(a ⊗ ~b), !(b ⊗ a)
?~a[0]: ~a[3] in !(b ⊗ a)[2], ~a[4] in !(b ⊗ a)[2]
?(a ⊗ ~b)[1]: a ⊗ ~b[5] in !(b ⊗ a)[2]
~a[3] — a[6]
~a[4] — a[10]
~b[7] — b[9]
proof net</desc>
