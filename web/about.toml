# cargo-about's configuration for the notices of the crates compiled into
# the WebAssembly module, which the package serves beside it. The
# licences are those deny.toml allows; the bindings' own crate, which is
# unpublished, is left out, since the package carries its LICENSE.
accepted = [
  "EUPL-1.2",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
